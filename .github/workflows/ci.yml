          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Missing required path: $path"
              status=1
            fi
          done

          # Every reserved top-level directory must exist and explain itself.
          for dir in skills shared packages scripts templates tests examples; do
            if [ ! -f "$dir/README.md" ]; then
              echo "::error::Missing $dir/README.md (reserved directories must document their purpose)"
              status=1
            fi
          done

          if [ "$status" -eq 0 ]; then
            echo "Repository structure is complete."
          fi
          exit "$status"
