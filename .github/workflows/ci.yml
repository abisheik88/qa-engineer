# Continuous integration for the repository foundation.
# Every job here runs against the current repository content — no job depends
# on artifacts, packages, or tooling that does not exist yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint Markdown (markdownlint-cli2)
        run: npx --yes markdownlint-cli2 "**/*.md"

  editorconfig:
    name: EditorConfig compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check formatting against .editorconfig
        run: npx --yes editorconfig-checker

  internal-links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check relative links between files (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-verbatim "**/*.md"
          fail: true

  skill-platform:
    name: Skill platform validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # check-docs-commands executes `qa <command> --help` for every documented
      # command — that is the point of it, since a documented command that no
      # longer runs is exactly the drift it exists to catch. Executing the CLI
      # needs its declared dependencies, so this job installs them like any other.
      - name: Install dependencies
        run: npm ci
      - name: Validate skills against the specification
        run: node scripts/validate-skills.mjs
      - name: Verify shared-knowledge sync integrity
        run: node scripts/sync-shared.mjs --check
      - name: Report description keyword collisions (advisory)
        run: node scripts/check-keywords.mjs
      - name: Check the QA knowledge base is consistent
        run: node scripts/check-knowledge.mjs
      - name: Check the capability matrix is internally consistent
        run: node scripts/check-capability-matrix.mjs
      - name: Check framework registry is the single source of truth
        run: node scripts/check-framework-registry.mjs
      - name: Architecture fitness tests
        run: node scripts/check-architecture-fitness.mjs
      - name: Spec ⇄ code consistency
        run: node scripts/check-spec-code-sync.mjs
      - name: Documentation claims match skill behavior
        run: node scripts/check-doc-claims.mjs
      - name: Report branding has a single source and stays out of artifacts
        run: node scripts/check-branding.mjs
      - name: Every documented CLI command exists and runs
        run: node scripts/check-docs-commands.mjs
      - name: Release validation (identity, versions, tarball contents)
        run: node scripts/release/validate-release.mjs   # unpacks and runs the CLI
      - name: Validate every JSON Schema parses
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r schema; do
            if node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$schema"; then
              echo "ok: $schema"
            else
              echo "::error file=$schema::invalid JSON"
              status=1
            fi
          done < <(find skills templates shared -name '*.schema.json' | sort)
          exit "$status"

  analysis:
    name: Analysis toolkit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # COMPATIBILITY.md states Python 3.8+. 3.9 is the oldest version the
        # hosted runners provide; the 3.8 floor is enforced separately by a
        # syntax gate (below) that parses every shipped module with
        # feature_version=(3, 8).
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Confirm every shipped module parses under the stated 3.8 floor
        run: python3 scripts/check-python-floor.py
      - name: Run analysis unit tests (core, Playwright, Selenium, cross-framework)
        run: python3 shared/analysis/lib/run_tests.py
      - name: Node engine matches Python, output for output (port parity)
        run: |
          set -euo pipefail
          node scripts/check-engine-parity.mjs
      - name: Run diagnostic unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=shared/analysis/lib:shared/diagnostics/lib python3 -m unittest discover -s shared/diagnostics/lib/tests -v
      - name: Run internal seam regression tests
        run: |
          set -euo pipefail
          PYTHONPATH=shared/analysis/lib:shared/diagnostics/lib python3 -m unittest discover -s tests/seams -v
      - name: Validate the context schema against a sample
        run: |
          set -euo pipefail
          cd shared/analysis/lib
          python3 -m qa_analysis.cli validate tests/fixtures/valid-context.json ../schemas/context.schema.json
      - name: Parse and validate a real .qa/context.md end to end
        run: |
          set -euo pipefail
          cd shared/analysis/lib
          # The Markdown path is what qa-init actually writes; validating only a
          # hand-written JSON fixture left the real artifact unchecked.
          python3 -m qa_analysis.cli context --path tests/fixtures/valid-context.md > /dev/null
          # The template is deliberately full of placeholders: it must NOT validate.
          if python3 -m qa_analysis.cli context \
              --path ../../../skills/qa-init/templates/context.md > /dev/null; then
            echo "::error::the qa-init template validated, so placeholders are being accepted"
            exit 1
          fi
          echo "context parser accepts a generated file and rejects the raw template"
      - name: Confirm the contract validator rejects an invalid result
        run: |
          set -euo pipefail
          cd shared/analysis/lib
          if python3 -m qa_analysis.cli validate tests/fixtures/invalid-execution-result.json \
              ../../../skills/qa-run/contracts/execution-result.schema.json; then
            echo "::error::validator accepted an invalid contract"
            exit 1
          fi
          echo "validator correctly rejected the invalid contract"
      - name: Verify bundled tooling RUNS self-contained in every bundling skill
        run: python3 scripts/bundle_python.py --check
      - name: Run behavioral eval harness (deterministic gate)
        run: python3 tests/evals/run_evals.py
      - name: Run live-agent eval (replay provider) + regression gate
        run: python3 tests/evals/run_live.py --baseline tests/evals/baselines/reference.json

  installer:
    name: Installer CLI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=18.18.0; test the floor, the
        # current LTS, and the next line so the declared range is real.
        node-version: [18, 20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Python (the installer bundles and verifies a Python engine)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Run installer tests (install, verify, doctor, drift, bundle, parity, uninstall)
        run: npm test

  repo-structure:
    name: Repository structure
    runs-on: ubuntu-latest
