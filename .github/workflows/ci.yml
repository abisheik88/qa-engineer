# Continuous integration for the repository foundation.
# Every job here runs against the current repository content — no job depends
# on artifacts, packages, or tooling that does not exist yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint Markdown (markdownlint-cli2)
        run: npx --yes markdownlint-cli2 "**/*.md"

  editorconfig:
    name: EditorConfig compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check formatting against .editorconfig
        run: npx --yes editorconfig-checker

  internal-links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check relative links between files (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-verbatim "**/*.md"
          fail: true

  skill-platform:
    name: Skill platform validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # check-docs-commands executes `qa <command> --help` for every documented
      # command — that is the point of it, since a documented command that no
      # longer runs is exactly the drift it exists to catch. Executing the CLI
      # needs its declared dependencies, so this job installs them like any other.
      - name: Install dependencies
        run: npm ci
      - name: Validate skills against the specification
        run: node scripts/validate-skills.mjs
      - name: Verify shared-knowledge sync integrity
        run: node scripts/sync-shared.mjs --check
      - name: Report description keyword collisions (advisory)
        run: node scripts/check-keywords.mjs
      - name: Check the QA knowledge base is consistent
        run: node scripts/check-knowledge.mjs
      - name: Check the capability matrix is internally consistent
        run: node scripts/check-capability-matrix.mjs
      - name: Check framework registry is the single source of truth
        run: node scripts/check-framework-registry.mjs
      - name: Architecture fitness tests
        run: node scripts/check-architecture-fitness.mjs
      - name: Spec ⇄ code consistency
        run: node scripts/check-spec-code-sync.mjs
      - name: Documentation claims match skill behavior
        run: node scripts/check-doc-claims.mjs
      - name: Report branding has a single source and stays out of artifacts
        run: node scripts/check-branding.mjs
      - name: Every documented CLI command exists and runs
        run: node scripts/check-docs-commands.mjs
      - name: Release validation (identity, versions, tarball contents)
        run: node scripts/release/validate-release.mjs   # unpacks and runs the CLI
      - name: Validate every JSON Schema parses
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r schema; do
            if node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$schema"; then
              echo "ok: $schema"
            else
              echo "::error file=$schema::invalid JSON"
              status=1
            fi
          done < <(find skills templates shared -name '*.schema.json' | sort)
          exit "$status"

  engine:
    name: Deterministic engine (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=18.18.0. The engine is what runs in a
        # user's repository, so the declared floor is tested, not assumed.
        node-version: [18, 20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run engine unit tests (analysis, diagnostics, frameworks, seams)
        run: node --test packages/engine/test/*.test.mjs
      - name: The engine CLI runs every documented subcommand
        run: |
          set -euo pipefail
          cli="node packages/engine/bin/qa-engine.mjs"
          $cli analysis junit packages/engine/test/fixtures/playwright-junit.xml > /dev/null
          $cli analysis har packages/engine/test/fixtures/sample.har > /dev/null
          $cli analysis diff-guard packages/engine/test/fixtures/unsafe.diff > /dev/null
          $cli analysis classify "no such element: #cart" > /dev/null
          $cli analysis context --path packages/engine/test/fixtures/valid-context.md > /dev/null
          $cli analysis branding --format html > /dev/null
          $cli analysis report-html packages/engine/test/corpus/explore-result.sample.json > /dev/null
          $cli playwright report packages/engine/test/fixtures/playwright-junit.xml > /dev/null 2>&1 || true
          echo "every documented subcommand ran"
      - name: A malformed artifact exits 2 with a machine-readable body, never a traceback
        run: |
          set -euo pipefail
          printf 'not xml' > /tmp/bad.xml
          set +e
          out="$(node packages/engine/bin/qa-engine.mjs analysis junit /tmp/bad.xml)"
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "::error::expected exit 2, got $code"
            exit 1
          fi
          echo "$out" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!d.error){process.exit(1)}'
          echo "malformed input refused cleanly"
      - name: Run behavioral eval harness (deterministic gate)
        run: node tests/evals/run-evals.mjs
      - name: Run live-agent eval (replay provider) + regression gate
        run: node tests/evals/run-live.mjs --baseline tests/evals/baselines/reference.json
  installer:
    name: Installer CLI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=18.18.0; test the floor, the
        # current LTS, and the next line so the declared range is real.
        node-version: [18, 20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run installer tests (install, verify, doctor, drift, bundle, parity, uninstall)
        run: npm test

  repo-structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
