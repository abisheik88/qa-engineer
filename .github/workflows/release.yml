# Release scaffold for qa-engineer.
# On a version tag (v*), builds, tests, and packs an npm tarball.
# npm publish is intentionally disabled until the package identity and
# NPM_TOKEN are confirmed — flip `if: false` when ready to ship to the registry.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Build and pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run installer tests
        run: npm test

      - name: Run Python suites
        run: |
          set -euo pipefail
          python3 scripts/check-python-floor.py
          python3 shared/analysis/lib/run_tests.py
          PYTHONPATH=shared/analysis/lib:shared/diagnostics/lib python3 -m unittest discover -s shared/diagnostics/lib/tests
          python3 scripts/bundle_python.py --check
          python3 tests/evals/run_evals.py
          python3 tests/evals/run_live.py --baseline tests/evals/baselines/reference.json

      - name: Structural and documentation validators
        run: |
          set -euo pipefail
          node scripts/validate-skills.mjs
          node scripts/sync-shared.mjs --check
          node scripts/check-knowledge.mjs
          node scripts/check-capability-matrix.mjs
          node scripts/check-framework-registry.mjs
          node scripts/check-architecture-fitness.mjs
          node scripts/check-spec-code-sync.mjs
          node scripts/check-doc-claims.mjs
          node scripts/check-docs-commands.mjs

      # Verifies version/tag consistency and that the tarball carries everything
      # the installer bundles — a release that omits bundled code installs broken.
      - name: Release validation
        run: node scripts/release/validate-release.mjs

      - name: Pack npm tarball
        run: npm pack

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-engineer-tarball
          path: qa-engineer-*.tgz
          if-no-files-found: error

      # TODO(M9): enable when npm package name/org and NPM_TOKEN are confirmed.
      # Do not publish from this PR / workflow until maintainers flip this gate.
      - name: Publish to npm (disabled)
        if: false
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
