# Release scaffold for qa-automation-pack.
# On a version tag (v*), builds, tests, and packs an npm tarball.
# npm publish is intentionally disabled until the package identity and
# NPM_TOKEN are confirmed — flip `if: false` when ready to ship to the registry.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Build and pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run installer tests
        run: npm test

      - name: Release validation
        run: node scripts/release/validate-release.mjs

      - name: Pack npm tarball
        run: npm pack

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-automation-pack-tarball
          path: qa-automation-pack-*.tgz
          if-no-files-found: error

      # TODO(M9): enable when npm package name/org and NPM_TOKEN are confirmed.
      # Do not publish from this PR / workflow until maintainers flip this gate.
      - name: Publish to npm (disabled)
        if: false
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
